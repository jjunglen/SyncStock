<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Search and link previews. Each page updates these as it opens
         (src/components/Seo.jsx); these are the home page's. -->
    <title>SyncStock — Restock alerts for sneaker, streetwear and card stores</title>
    <meta
      name="description"
      content="Restock alerts for sneaker, streetwear and trading card stores on Shopify. Shoppers get notified the moment their size is back, and you see exactly what to restock next."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SyncStock" />
    <meta property="og:title" content="SyncStock — Restock alerts for sneaker, streetwear and card stores" />
    <meta
      property="og:description"
      content="Restock alerts for sneaker, streetwear and trading card stores on Shopify. Shoppers get notified the moment their size is back, and you see exactly what to restock next."
    />
    <meta property="og:image" content="https://www.syncstock.io/og-image.png" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="900" />
    <meta property="og:image:alt" content="The SyncStock dashboard: revenue from alerts, what to source next and the notification funnel" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.syncstock.io/og-image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "SyncStock",
        "url": "https://www.syncstock.io/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web, Shopify",
        "description": "Restock alerts for sneaker, streetwear and trading card stores on Shopify.",
        "image": "https://www.syncstock.io/og-image.png",
        "publisher": { "@type": "Organization", "name": "SyncStock", "url": "https://www.syncstock.io/", "logo": "https://www.syncstock.io/icon-512.png" }
      }
    </script>
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Lets shoppers add the site to their Home Screen — iPhones only
         allow browser notifications for sites added that way -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SyncStock" />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      // Apply the saved customer-dashboard theme before first paint (no
      // dark flash). Mirrors src/lib/theme.js.
      (function () {
        if (!/^\/(store\/(dashboard|track|profile)|onboarding\/size)/.test(location.pathname)) return;
        try {
          var t = localStorage.getItem("syncstock_theme");
          if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          if (t === "light") document.documentElement.dataset.theme = "light";
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
