<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Syncstock</title>
    <script>
      // Apply the saved customer-dashboard theme before first paint (no
      // dark flash). Mirrors src/lib/theme.js.
      (function () {
        if (!/^\/(store\/(dashboard|track|profile)|onboarding\/size)/.test(location.pathname)) return;
        try {
          var t = localStorage.getItem("syncstock_theme");
          if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          if (t === "light") document.documentElement.dataset.theme = "light";
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
