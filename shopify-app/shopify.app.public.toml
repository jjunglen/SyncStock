# The public SyncStock app — the one merchants install (public distribution,
# so it can install on any store and charge through Shopify Billing).
# Replaces the original custom-distribution app (shopify.app.toml), which
# could only install on The Laboratory and couldn't bill.
# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "6400fce3b0764e4ecad29fb44d6de683"
name = "SyncStock"
# Its extensions: the web pixel, the theme blocks, and the sales channel
# (channel-config — the Lab's custom app leaves that one out)
extension_directories = [ "extensions/syncstock-pixel", "extensions/syncstock-theme", "extensions/channel-config" ]
# The dashboard's admin version (client/shopify.html). It must be the
# app's own address: App Bridge keeps the frame on it (pointing this at
# the API sent the frame to API pages — "Route not found"). With www, as
# syncstock.io redirects there. If SyncStock isn't approved on the shop
# yet, the page hands Shopify's signed link to the server's app entry
# (api.syncstock.io/api/store/shopify/app), which starts the install.
application_url = "https://www.syncstock.io/shopify"
# A sales channel lives inside the Shopify admin. Turn on together with
# Railway's SHOPIFY_PUBLIC_EMBEDDED=true (store.controller.js).
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_product_listings: the sales channel (channel connection, what's
# published to SyncStock) — public app only (store.controller.js appScopes)
scopes = "read_orders,read_products,write_pixels,read_customer_events,read_product_listings"
optional_scopes = [ ]
use_legacy_install_flow = true

[auth]
redirect_urls = [ "https://api.syncstock.io/api/store/shopify/callback" ]

[webhooks]
api_version = "2026-07"

# app/uninstalled can't be subscribed here while the app uses its own
# install flow (use_legacy_install_flow) — it's registered on each store
# at connect instead, with the product and order webhooks
# (registerShopifyWebhooks in server/src/controllers/store.controller.js).

# Shopify's required privacy webhooks (compliance.controller.js)
[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "https://api.syncstock.io/api/webhooks/shopify/compliance"
